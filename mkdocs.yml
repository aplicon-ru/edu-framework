site_name: Фреймворк управления образовательной организацией
site_url: https://aplicon-ru.github.io/edu-framework/
repo_url: https://github.com/aplicon-ru/edu-framework
repo_name: aplicon-ru/edu-framework
edit_uri: edit/main/

theme:
  name: material
  language: ru
  palette:
    - scheme: slate
      primary: teal
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
    - scheme: default
      primary: teal
      accent: blue
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
