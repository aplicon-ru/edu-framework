applicability_notes: |
  Набор отчётов зависит от типа ОО и ведомственной принадлежности: для каждой позиции реестра
  в standards/reporting/registry.json указано поле applies_to. Школы (общеобразовательные
  организации) в реестр не входят. Тип «do» фреймворка в реестре разделён на дошкольные организации
  (DO_PRE) и дополнительное образование детей (DO_ADD).

