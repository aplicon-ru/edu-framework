  профстандарт/квалтребования, а не ФГОС (ст. 76). ДПП моделируется отдельной карточкой
  на следующем шаге. Текущая версия покрывает норма-ось ВО/СПО (ОПОП на основе ФГОС).
  Учебно-методический контент (лекции, задания, материалы), рождающийся из РПД, —
  отдельный слой, наполняется позже.

