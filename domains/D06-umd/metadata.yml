applicability_notes: |
  ДО — partial. ДПО — partial: ДПП — сестринская карточка ОПОП (§1.16) с составной
  нормой-основанием (квалтребования, профстандарт, для переподготовки — результаты ФГОС);
  учебный план, РПД, ФОС и версия-манифест у ДПП общие с ОПОП (Инвариант 21). Не
  специфицирован календарный учебный график — для ДПП он обязательная часть программы.
  Учебно-методический контент — слой «Материал» (§1.15).

